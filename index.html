<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NayaGlow — Révèle la beauté au naturel</title>

    <meta
        name="description"
        content="NayaGlow — Soins naturels pour la peau et les cheveux à Brazzaville."
    >

    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- MAIN CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =====================================================
         PRELOADER
         ===================================================== -->

    <div class="preloader">

        <div class="preloader-logo">
            NayaGlow
        </div>

    </div>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header id="header">

        <div class="navbar">

            <a href="#home" class="logo">

                <img
                    src="naya-logo.jpg"
                    alt="NayaGlow"
                >

            </a>

            <nav
                class="nav-links"
                id="navLinks"
            >

                <a href="#home">
                    Accueil
                </a>

                <a href="#products">
                    Collection
                </a>

                <a href="#routine">
                    Rituel
                </a>

                <a href="#mothers">
                    Pour les mamans
                </a>

                <a href="#about">
                    La Maison
                </a>

                <a
                    href="#contact"
                    class="nav-cta"
                >
                    Commander
                </a>

                <!-- LANGUAGE SELECTOR -->

                <div
                    class="language-selector"
                    id="languageSelector"
                >

                    <button
                        type="button"
                        class="language-current"
                        onclick="toggleLanguageMenu()"
                    >

                        🌐
                        <span id="currentLanguage">
                            FR
                        </span>

                        <span>
                            ▾
                        </span>

                    </button>

                    <div
                        class="language-menu"
                        id="languageMenu"
                    >

                        <button
                            type="button"
                            onclick="changeLanguage('fr')"
                        >
                            🇫🇷 Français
                        </button>

                        <button
                            type="button"
                            onclick="changeLanguage('en')"
                        >
                            🇬🇧 English
                        </button>

                    </div>

                </div>

            </nav>

            <!-- MOBILE MENU -->

            <button
                class="menu-btn"
                id="menuBtn"
                aria-label="Menu"
            >
                ☰
            </button>

        </div>

    </header>
