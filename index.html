<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NayaGlow — Révèle la beauté au naturel</title>

<meta name="description"
content="NayaGlow — Soins naturels pour révéler votre beauté au quotidien. Découvrez nos soins pour la peau et les cheveux à Brazzaville.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "DM Sans", sans-serif;
    background: #f8f4ec;
    color: #2c241d;
    overflow-x: hidden;
}

img {
    max-width: 100%;
    display: block;
}

a {
    text-decoration: none;
    color: inherit;
}

button {
    font-family: inherit;
}


/* =====================================================
   VARIABLES
   ===================================================== */

:root {

    --cream: #f8f4ec;
    --ivory: #fffdf8;
    --gold: #b99555;
    --gold-light: #d8bd82;
    --brown: #3a2b20;
    --brown-soft: #6b5848;
    --green: #536653;
    --green-light: #879784;
    --white: #ffffff;
    --line: rgba(58,43,32,.12);

    --shadow:
        0 25px 70px rgba(62,45,30,.10);

    --gold-shadow:
        0 15px 45px rgba(185,149,85,.20);
}


/* =====================================================
   PRELOADER
   ===================================================== */

.preloader {
    position: fixed;
    inset: 0;
    background: var(--brown);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    animation: loaderOut 1s ease 1.8s forwards;
}

.loader-inner {
    text-align: center;
    color: var(--white);
}

.loader-name {
    font-family: "Cormorant Garamond", serif;
    font-size: 48px;
    letter-spacing: 8px;
}

.loader-line {
    width: 120px;
    height: 1px;
    background: var(--gold-light);
    margin: 18px auto;
    animation: loaderLine 1.4s ease infinite;
}

.loader-sub {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: .7;
}

@keyframes loaderLine {
    0%,100% {
        transform: scaleX(.3);
        opacity: .4;
    }

    50% {
        transform: scaleX(1);
        opacity: 1;
    }
}

@keyframes loaderOut {
    to {
        opacity: 0;
        visibility: hidden;
    }
}


/* =====================================================
   NAVIGATION
   ===================================================== */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    padding: 18px 5%;
    transition: .4s ease;
}

header.scrolled {
    background: rgba(255,253,248,.92);
    backdrop-filter: blur(18px);
    box-shadow: 0 8px 30px rgba(50,40,30,.06);
}

.navbar {
    max-width: 1250px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo img {
    width: 105px;
    height: auto;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 34px;
    font-size: 13px;
}

.nav-links a {
    position: relative;
    transition: .3s ease;
}

.nav-links a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -7px;
    width: 0;
    height: 1px;
    background: var(--gold);
    transition: .3s ease;
}

.nav-links a:hover {
    color: var(--gold);
}

.nav-links a:hover::after {
    width: 100%;
}

.nav-cta {
    border: 1px solid var(--gold);
    padding: 11px 20px;
    color: var(--brown);
}

.nav-cta:hover {
    background: var(--gold);
    color: white !important;
}

.menu-btn {
    display: none;
    border: 0;
    background: none;
    font-size: 25px;
    color: var(--brown);
}


/* =====================================================
   HERO
   ===================================================== */

.hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    overflow: hidden;
    background:
        radial-gradient(circle at 80% 35%, rgba(185,149,85,.16), transparent 30%),
        linear-gradient(120deg, #f8f4ec, #fffdf8);
}

.hero-content {
    width: 90%;
    max-width: 1250px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    padding-top: 80px;
}

.hero-text {
    position: relative;
    z-index: 5;
}

.eyebrow {
    text-transform: uppercase;
    letter-spacing: 5px;
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 25px;
}

.hero h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(58px, 7vw, 105px);
    line-height: .88;
    font-weight: 500;
    letter-spacing: -2px;
}

.hero h1 span {
    color: var(--gold);
    font-style: italic;
}

.hero-description {
    max-width: 480px;
    color: var(--brown-soft);
    line-height: 1.8;
    margin: 30px 0;
    font-size: 15px;
}

.hero-buttons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 15px 25px;
    border-radius: 0;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: .35s ease;
}

.btn-primary {
    background: var(--brown);
    color: white;
}

.btn-primary:hover {
    background: var(--gold);
    transform: translateY(-3px);
    box-shadow: var(--gold-shadow);
}

.btn-outline {
    border: 1px solid var(--brown);
}

.btn-outline:hover {
    background: var(--brown);
    color: white;
}

.hero-visual {
    min-height: 590px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero-circle {
    width: 470px;
    height: 470px;
    border-radius: 50%;
    background:
        radial-gradient(circle, #fff 20%, #eadbbd 55%, #c4aa76 100%);
    box-shadow:
        0 35px 90px rgba(83,67,45,.18);
    animation: float 6s ease-in-out infinite;
}

.hero-circle::after {
    content: "N";
    position: absolute;
    font-family: "Cormorant Garamond", serif;
    font-size: 280px;
    color: rgba(255,255,255,.4);
    font-style: italic;
}

.floating-card {
    position: absolute;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(12px);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    font-size: 11px;
    letter-spacing: 1px;
}

.card-top {
    top: 80px;
    right: 5%;
    animation: floatSmall 5s ease-in-out infinite;
}

.card-bottom {
    bottom: 70px;
    left: 5%;
    animation: floatSmall 6s ease-in-out infinite reverse;
}

.gold-orb {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(185,149,85,.35);
    filter: blur(3px);
    top: 10%;
    left: 5%;
    animation: drift 8s ease-in-out infinite;
}

@keyframes float {
    0%,100% {
        transform: translateY(0) rotate(0);
    }

    50% {
        transform: translateY(-18px) rotate(2deg);
    }
}

@keyframes floatSmall {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

@keyframes drift {
    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(40px,25px);
    }
}


/* =====================================================
   MOVING MARQUEE
   ===================================================== */

.marquee {
    overflow: hidden;
    background: var(--brown);
    color: white;
    padding: 17px 0;
    white-space: nowrap;
}

.marquee-track {
    display: inline-flex;
    gap: 45px;
    animation: marquee 25s linear infinite;
}

.marquee span {
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    letter-spacing: 2px;
}

.marquee .dot {
    color: var(--gold-light);
}

@keyframes marquee {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }
}


/* =====================================================
   GENERAL SECTIONS
   ===================================================== */

section {
    padding: 110px 5%;
}

.container {
    max-width: 1200px;
    margin: auto;
}

.section-label {
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 10px;
    margin-bottom: 18px;
}

.section-title {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(45px, 5vw, 72px);
    line-height: .95;
    font-weight: 500;
}

.section-intro {
    max-width: 600px;
    color: var(--brown-soft);
    line-height: 1.8;
    margin-top: 22px;
}


/* =====================================================
   PRODUCTS
   ===================================================== */

.products-section {
    background: var(--ivory);
}

.products-heading {
    display: flex;
    justify-content: space-between;
    align-items: end;
    margin-bottom: 55px;
    gap: 30px;
}

.products-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.product-card {
    background: #f6f0e5;
    position: relative;
    overflow: hidden;
    transition: .4s ease;
}

.product-card:hover {
    transform: translateY(-10px);
    box-shadow: var(--shadow);
}

.product-image {
    height: 350px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.product-image::before {
    content: "";
    width: 190px;
    height: 190px;
    background: rgba(185,149,85,.15);
    border-radius: 50%;
    position: absolute;
}

.bottle {
    width: 95px;
    height: 190px;
    border-radius: 12px 12px 20px 20px;
    background: linear-gradient(90deg,#8b704a,#d5bb85,#9b7b4b);
    position: relative;
    z-index: 2;
    box-shadow: 15px 20px 35px rgba(45,30,15,.18);
}

.bottle::before {
    content: "";
    position: absolute;
    width: 45px;
    height: 28px;
    top: -25px;
    left: 25px;
    background: #3a2b20;
    border-radius: 5px 5px 2px 2px;
}

.bottle::after {
    content: "NAYA";
    position: absolute;
    left: 10px;
    right: 10px;
    top: 70px;
    padding: 8px 2px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    color: #fff;
    border-top: 1px solid rgba(255,255,255,.5);
    border-bottom: 1px solid rgba(255,255,255,.5);
}

.product-info {
    padding: 25px;
}

.product-info h3 {
    font-family: "Cormorant Garamond", serif;
    font-size: 27px;
    font-weight: 600;
}

.product-info p {
    color: var(--brown-soft);
    font-size: 13px;
    margin-top: 8px;
    line-height: 1.6;
}

.product-link {
    display: inline-block;
    margin-top: 18px;
    color: var(--gold);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
}


/* =====================================================
   ABOUT
   ===================================================== */

.about {
    background: var(--cream);
}

.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
}

.about-visual {
    min-height: 500px;
    position: relative;
}

.about-box {
    width: 78%;
    height: 450px;
    background:
        linear-gradient(145deg,#c6b080,#f1e6ce,#7b856e);
    position: relative;
}

.about-box::before {
    content: "NAYA";
    position: absolute;
    font-family: "Cormorant Garamond", serif;
    font-size: 110px;
    color: rgba(255,255,255,.35);
    left: 20px;
    bottom: 20px;
    letter-spacing: 8px;
}

.about-floating {
    position: absolute;
    right: 0;
    bottom: 30px;
    width: 220px;
    padding: 30px;
    background: white;
    box-shadow: var(--shadow);
}

.about-floating strong {
    display: block;
    font-family: "Cormorant Garamond", serif;
    font-size: 35px;
    color: var(--gold);
}

.about-text p {
    margin-top: 25px;
    color: var(--brown-soft);
    line-height: 1.9;
}

.signature {
    margin-top: 35px;
    font-family: "Cormorant Garamond", serif;
    font-size: 30px;
    font-style: italic;
}


/* =====================================================
   WHY NAYA
   ===================================================== */

.why {
    background: var(--brown);
    color: white;
}

.why .section-intro {
    color: rgba(255,255,255,.7);
}

.benefits-grid {
    margin-top: 60px;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    border-top: 1px solid rgba(255,255,255,.15);
}

.benefit {
    padding: 35px 25px;
    border-right: 1px solid rgba(255,255,255,.15);
    transition: .4s ease;
}

.benefit:last-child {
    border-right: 0;
}

.benefit:hover {
    background: rgba(255,255,255,.04);
    transform: translateY(-5px);
}

.benefit-number {
    font-family: "Cormorant Garamond", serif;
    font-size: 40px;
    color: var(--gold-light);
}

.benefit h3 {
    font-family: "Cormorant Garamond", serif;
    font-size: 27px;
    margin: 20px 0 10px;
}

.benefit p {
    color: rgba(255,255,255,.65);
    font-size: 13px;
    line-height: 1.7;
}


/* =====================================================
   MOTHER SECTION
   ===================================================== */

.mother {
    background:
        radial-gradient(circle at 10% 50%, rgba(135,151,132,.17), transparent 30%),
        var(--ivory);
}

.mother-grid {
    display: grid;
    grid-template-columns: .9fr 1.1fr;
    gap: 90px;
    align-items: center;
}

.mother-quote {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(42px,5vw,70px);
    line-height: .98;
}

.mother-quote span {
    color: var(--gold);
    font-style: italic;
}

.mother-text {
    color: var(--brown-soft);
    line-height: 1.9;
    font-size: 15px;
}

.mother-text p + p {
    margin-top: 20px;
}


/* =====================================================
   ROUTINE
   ===================================================== */

.routine {
    background: #eee7da;
}

.routine-grid {
    margin-top: 60px;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 25px;
}

.routine-card {
    background: white;
    padding: 35px;
    position: relative;
    overflow: hidden;
    transition: .4s ease;
}

.routine-card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow);
}

.routine-number {
    font-family: "Cormorant Garamond", serif;
    font-size: 80px;
    color: rgba(185,149,85,.18);
    position: absolute;
    right: 15px;
    top: -5px;
}

.routine-card h3 {
    font-family: "Cormorant Garamond", serif;
    font-size: 30px;
    margin-top: 30px;
}

.routine-card p {
    color: var(--brown-soft);
    line-height: 1.7;
    margin-top: 15px;
    font-size: 13px;
}


/* =====================================================
   TESTIMONIALS
   ===================================================== */

.testimonials {
    background: var(--ivory);
}

.testimonial-grid {
    margin-top: 60px;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 25px;
}

.testimonial {
    padding: 35px;
    border: 1px solid var(--line);
    position: relative;
    transition: .4s ease;
}

.testimonial:hover {
    transform: translateY(-7px);
    box-shadow: var(--shadow);
}

.stars {
    color: var(--gold);
    letter-spacing: 4px;
    font-size: 13px;
}

.testimonial p {
    font-family: "Cormorant Garamond", serif;
    font-size: 25px;
    line-height: 1.2;
    margin: 25px 0;
}

.testimonial strong {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
}


/* =====================================================
   CTA
   ===================================================== */

.cta {
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 80% 20%, rgba(216,189,130,.3), transparent 25%),
        var(--green);
    color: white;
    text-align: center;
}

.cta::before {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 50%;
    top: -200px;
    left: -100px;
    animation: rotateCircle 18s linear infinite;
}

.cta h2 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(50px,7vw,90px);
    font-weight: 500;
    position: relative;
}

.cta p {
    max-width: 550px;
    margin: 20px auto 35px;
    color: rgba(255,255,255,.75);
    line-height: 1.7;
}

.cta .btn {
    background: white;
    color: var(--brown);
}

.cta .btn:hover {
    background: var(--gold-light);
    color: white;
}

@keyframes rotateCircle {
    to {
        transform: rotate(360deg);
    }
}


/* =====================================================
   FOOTER
   ===================================================== */

footer {
    background: #241b15;
    color: white;
    padding: 70px 5% 30px;
}

.footer-grid {
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr;
    gap: 60px;
}

.footer-brand img {
    width: 120px;
    filter: brightness(0) invert(1);
    margin-bottom: 20px;
}

.footer-brand p {
    color: rgba(255,255,255,.55);
    line-height: 1.7;
    max-width: 320px;
    font-size: 13px;
}

.footer-col h4 {
    color: var(--gold-light);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

.footer-col a {
    display: block;
    color: rgba(255,255,255,.65);
    font-size: 13px;
    margin-bottom: 12px;
    transition: .3s ease;
}

.footer-col a:hover {
    color: white;
    transform: translateX(4px);
}

.footer-bottom {
    max-width: 1200px;
    margin: 50px auto 0;
    padding-top: 25px;
    border-top: 1px solid rgba(255,255,255,.1);
    display: flex;
    justify-content: space-between;
    gap: 20px;
    color: rgba(255,255,255,.4);
    font-size: 11px;
}


/* =====================================================
   WHATSAPP FLOAT
   ===================================================== */

.whatsapp {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #25D366;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    z-index: 900;
    box-shadow: 0 12px 30px rgba(0,0,0,.18);
    animation: pulse 2.5s infinite;
}

@keyframes pulse {
    0%,100% {
        box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }

    50% {
        box-shadow: 0 12px 40px rgba(37,211,102,.4);
    }
}


/* =====================================================
   REVEAL ANIMATIONS
   ===================================================== */

.reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity .9s ease, transform .9s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0);
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width: 900px) {

    .nav-links {
        position: fixed;
        top: 0;
        right: -100%;
        width: 280px;
        height: 100vh;
        background: var(--ivory);
        flex-direction: column;
        justify-content: center;
        gap: 25px;
        box-shadow: -15px 0 40px rgba(0,0,0,.1);
        transition: .4s ease;
    }

    .nav-links.active {
        right: 0;
    }

    .menu-btn {
        display: block;
        position: relative;
        z-index: 1001;
    }

    .hero-content,
    .about-grid,
    .mother-grid {
        grid-template-columns: 1fr;
    }

    .hero {
        padding-top: 100px;
    }

    .hero-visual {
        min-height: 450px;
    }

    .hero-circle {
        width: 350px;
        height: 350px;
    }

    .benefits-grid {
        grid-template-columns: 1fr 1fr;
    }

    .benefit:nth-child(2) {
        border-right: 0;
    }

    .benefit:nth-child(-n+2) {
        border-bottom: 1px solid rgba(255,255,255,.15);
    }

    .products-grid,
    .routine-grid,
    .testimonial-grid {
        grid-template-columns: 1fr 1fr;
    }

    .footer-grid {
        grid-template-columns: 1fr 1fr;
    }
}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    header {
        padding: 15px 5%;
    }

    .logo img {
        width: 85px;
    }

    section {
        padding: 75px 6%;
    }

    .hero-content {
        padding-top: 50px;
    }

    .hero h1 {
        font-size: 62px;
    }

    .hero-description {
        font-size: 14px;
    }

    .hero-visual {
        min-height: 390px;
    }

    .hero-circle {
        width: 280px;
        height: 280px;
    }

    .hero-circle::after {
        font-size: 170px;
    }

    .floating-card {
        padding: 14px;
        font-size: 9px;
    }

    .card-top {
        top: 30px;
    }

    .card-bottom {
        bottom: 30px;
    }

    .products-heading {
        display: block;
    }

    .products-grid,
    .routine-grid,
